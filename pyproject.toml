[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adas-simulation-platform"
version = "0.2.0"
description = "Reproducible autonomous parking planning and simulation laboratory"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
adas-parking = "adas_sim.cli:main"
adas-benchmark = "adas_sim.benchmark:main"
adas-workbench = "adas_sim.web_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
