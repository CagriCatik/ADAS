name: Publish validated simulation results
on:
  push:
    branches: [main]
    paths:
      - "src/adas_sim/**"
      - "scripts/publish_validated_results.py"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/validated_results.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validated-results
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Unit and regression tests
        run: python -m pytest -q
      - name: Render validated scenarios
        run: python scripts/publish_validated_results.py
        env:
          MPLBACKEND: Agg
      - name: Check generated output and commit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path('docs/assets/validated_results')
          rows=json.loads((p/'summary.json').read_text())
          assert len(rows)==3 and all(r['status']=='PASS' for r in rows)
          for r in rows:
              name=r['scenario']
              with Image.open(p/f'{name}.gif') as im:
                  assert im.n_frames>=3 and im.size==(1280,720)
              with Image.open(p/f'{name}.png') as im: im.verify()
              assert (p/f'{name}_ultrasound.csv').is_file()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/validated_results
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish validated 12-USS scenario results [skip ci]"
            git push
          fi
