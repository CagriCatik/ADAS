name: Publish parking GIF gallery
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/assets/parking/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: parking-gif-gallery
  cancel-in-progress: false

jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
      - name: Build validated GIFs and SVGs
        run: python scripts/generate_gallery.py
      - name: Commit generated gallery to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/parking
          if ! git diff --cached --quiet; then
            git commit -m "docs: refresh parking GIF gallery [skip ci]"
            git push
          fi
